<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CHÉRIE Office Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Be+Vietnam+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.item.wrap .t1,.item.wrap .t2{white-space:normal;overflow:visible;text-overflow:clip}
.item.wrap .t1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpis>div{display:grid;gap:2px}
.kpis b{font-size:20px;font-variant-numeric:tabular-nums}
.tuxem{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.tuxem div{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:10px;overflow:hidden}
.tuxem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.tuxem span{grid-column:1/-1;font-size:12px;padding:4px 2px;color:var(--muted)}
</style>
<style>
/* Layout: app quản trị một cột cho điện thoại, thanh tab dưới, bảng trượt từ dưới lên cho chi tiết */
:root{
  --bg:#F5F3F2; --surface:#FFFFFF; --soft:#EFE7E1; --ink:#1B1618; --muted:#6E625C; --line:#E2D8D1;
  --espresso:#4E3B31; --gold:#7A5C2E; --wine:#7A1F3D; --care:#24476B;
  --ok:#2F6B45; --warn:#9A6414; --bad:#A3312C; --okbg:#E4EFE7; --warnbg:#F6ECD9; --badbg:#F6E1DF; --infobg:#E1E8F0;
  --display:"Playfair Display","Didot","Times New Roman",serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#221B17; --soft:#2C231E; --ink:#F2ECE8; --muted:#B3A69E; --line:#3A2F29;
  --espresso:#D9C3B3; --gold:#D2AE73; --wine:#E08AA6; --care:#8FB4DA;
  --ok:#8CCB9F; --warn:#E3B66A; --bad:#EE958E; --okbg:#1E3326; --warnbg:#3A2D16; --badbg:#3D1F1D; --infobg:#1C2A39; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#221B17; --soft:#2C231E; --ink:#F2ECE8; --muted:#B3A69E; --line:#3A2F29;
  --espresso:#D9C3B3; --gold:#D2AE73; --wine:#E08AA6; --care:#8FB4DA;
  --ok:#8CCB9F; --warn:#E3B66A; --bad:#EE958E; --okbg:#1E3326; --warnbg:#3A2D16; --badbg:#3D1F1D; --infobg:#1C2A39; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
h1,h2,h3,.kpi .v,.logo{font-variant-numeric:lining-nums tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:19px;line-height:1}
.logo small{display:block;white-space:nowrap;font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--gold);margin-top:4px;font-weight:500}
.sync{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.iconbtn svg{width:16px;height:16px}
.iconbtn span{white-space:nowrap}
@media (max-width:420px){.iconbtn span{display:none}.iconbtn{width:44px;padding:0;justify-content:center}#logout span{display:inline}#logout{width:auto;padding:0 12px}}
.dot[hidden]{display:none!important}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;position:relative}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--espresso)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold);border-radius:2px}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--wine);color:#fff;font-size:10px;font-family:var(--mono);display:flex;align-items:center;justify-content:center}

/* Type */
h1{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.15;margin:22px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:28px 0 10px;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--muted);margin:0 0 6px}
.num{font-variant-numeric:lining-nums tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Banner */
.banner{border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--infobg)}
.banner.bad{background:var(--badbg)}
.banner.warn{background:var(--warnbg)}
.banner b{display:block}
.banner .act{margin-top:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:24px;line-height:1.2;margin-top:4px;font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.kpi .h{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--espresso);border-color:var(--espresso);color:var(--bg)}
.kpi.hero .l,.kpi.hero .h{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.kpi.hero .v{font-size:32px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:10px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:5px;background:var(--espresso)}
.bar .n{text-align:right;font-family:var(--mono);font-size:12px}
.goal{display:grid;gap:12px}
.goal .row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.goal .track{grid-column:1/-1;height:8px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden}
.goal .track i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.goal .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Chips & pills */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--espresso);border-color:var(--espresso);color:var(--bg)}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--okbg);color:var(--ok)} .p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)} .p-info{background:var(--infobg);color:var(--care)} .p-mute{background:var(--soft);color:var(--muted)}

/* Lists */
.list{display:grid;gap:8px;margin-top:8px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.item.noimg{grid-template-columns:minmax(0,1fr) auto}
.item .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;display:grid;gap:4px;justify-items:end}
.thumb{width:56px;height:70px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:var(--espresso);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.wear{height:4px;background:var(--soft);border-radius:2px;width:70px;overflow:hidden}
.wear i{display:block;height:100%;background:var(--gold)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);margin-top:10px}
.group{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 2px}

/* Buttons */
.btn{transition:opacity .15s,transform .1s;border:1px solid var(--espresso);background:var(--espresso);color:var(--bg);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:transparent;color:var(--espresso)}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:active,.item:active,.chip:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){.btn:active,.item:active,.chip:active{transform:none}}
.btn.full{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btnrow .btn{flex:1 1 140px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:24;border-radius:999px;min-height:50px;padding:0 20px;box-shadow:0 6px 20px rgba(40,25,15,.25)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);margin-top:12px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.sheet h3{font-family:var(--display);font-weight:500;font-size:22px;margin:4px 0 2px;text-wrap:balance}
.close{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.dl{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr);gap:6px 12px;font-size:14px;margin-top:12px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;overflow-wrap:anywhere}
.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.gallery a{flex:none;width:76px;height:96px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted);text-decoration:none;position:relative;overflow:hidden}
.gallery a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}

/* Forms */
.form{display:grid;gap:12px;margin-top:12px}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:13px;font-weight:500}
.f .hint{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:9px 12px;font-size:16px}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.pick{display:grid;gap:6px;max-height:300px;overflow-y:auto;margin-top:6px}
.pick label{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.pick input{width:20px;height:20px;accent-color:var(--espresso)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.skel{height:64px;border-radius:var(--r);background:linear-gradient(90deg,var(--soft),var(--surface),var(--soft));background-size:200% 100%;animation:sk 1.4s ease infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
a.lk{color:var(--care);overflow-wrap:anywhere}
</style>
<script src="config.js"></script>
</head>
<body>


<header class="top"><div class="in">
  <div class="logo">CHÉRIE<small>OFFICE · QUẢN TRỊ</small></div>
  <div class="sync" id="sync">Chưa tải</div>
  <button class="iconbtn" id="logout" type="button" hidden><span style="display:inline">Thoát</span></button>
  <button class="iconbtn" id="reload" type="button" aria-label="Tải lại dữ liệu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>Tải lại</span></button>
</div></header>

<main class="wrap" id="main"></main>

<nav class="tabs" aria-label="Mục"><div class="in">
  <a href="#tong-quan" data-v="tong-quan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Tổng quan</a>
  <a href="#nhap" data-v="nhap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Nhập hàng<span class="dot" id="dotNhap" hidden></span></a>
  <a href="#kho" data-v="kho"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a2 2 0 0 1 2 2c0 1.2-2 1.6-2 3l9 6.5a1.4 1.4 0 0 1-.8 2.5H3.8a1.4 1.4 0 0 1-.8-2.5L12 8"/></svg>Kho đồ</a>
  <a href="#khach" data-v="khach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Khách & gói<span class="dot" id="dotKhach" hidden></span></a>
  <a href="#giao" data-v="giao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Giao nhận</a>
</div></nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
"use strict";
var TABS=["NhapTuLink","SanPham","Anh","Dong","KhachHang","DangKy","TuDo","GiaoNhan","DangKyWeb"];
var MA_DONG={"Classic":"CL","Mẹ bầu & Sau sinh":"ME","Lead":"LD","Áo dài":"AD","Travel":"TR","Ngày quan trọng":"NQ"};
var DONG_DEFAULT=["Mẹ bầu & Sau sinh","Lead","Áo dài","Travel","Ngày quan trọng","Classic"];
var LISTS={
  Loai:["Áo sơ mi","Áo kiểu","Quần tây","Chân váy","Đầm công sở","Vest, blazer"],
  Form:["Ôm sát","Co giãn nhẹ","Suông"],
  PhongCach:["Thanh lịch","Hiện đại","Mềm mại","Quyền lực"],
  TTNhap:["Chờ AI","Cần AI làm lại","Chờ duyệt","Duyệt","Đã đăng","Lỗi","Bỏ"],
  TTSP:["Sẵn sàng","Ở tủ khách","Đang giặt","Sửa","Ngưng","Mất","Chuyển Seconde"],
  TTDK:["Chờ xác nhận","Đang dùng","Tạm dừng","Hết hạn","Huỷ"],
  TTTD:["Đã xếp","Đã giao","Đã lấy","Đang giặt","Hư hỏng","Mất"],
  TTGN:["Chưa đi","Đã xong","Lệch"],
  Size:["S","M","L","XL"],
  Gu:["Tối giản, màu trung tính","Mềm mại, nữ tính","Sắc sảo, quyền lực","Để stylist chọn"],
  Nguon:["Website","Zalo","Facebook","Instagram","Bạn giới thiệu","Khách Closet","Gói công ty"]
};
/* Phí giao theo tháng [GĐ] — đổi ở đây khi chốt */
var PHI_GIAO={"Văn phòng|Trung tâm":0,"Văn phòng|Mở rộng":150000,"Nhà riêng|Trung tâm":150000,"Nhà riêng|Mở rộng":250000};
var COC=1000000;

var SAMPLE_NOTE="Mẫu minh hoạ, chưa phải số thật";

/* ---------- utils ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function N(v){if(v==null||v==="")return 0;var s=String(v).replace(/[^\d\-]/g,"");var n=parseInt(s,10);return isNaN(n)?0:n}
function money(n){return Math.round(n).toLocaleString("vi-VN")+"đ"}
function pad(n){return (n<10?"0":"")+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function nowStr(){var d=new Date();return ymd(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function parseD(s){if(!s)return null;var m=String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null}
function dmy(s){var d=parseD(s);return d?pad(d.getDate())+"/"+pad(d.getMonth()+1):"—"}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function addMonths(d,n){var x=new Date(d);x.setMonth(x.getMonth()+n);return x}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function colL(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
function rows(t){return (S.data[t]&&S.data[t].rows)||[]}
function head(t){return (S.data[t]&&S.data[t].head)||[]}
function nextId(t,key,prefix,width){var mx=0;rows(t).forEach(function(r){var v=String(r[key]||"");if(v.indexOf(prefix)===0){var n=parseInt(v.slice(prefix.length),10);if(n>mx)mx=n}});var n=String(mx+1);while(n.length<width)n="0"+n;return prefix+n}
function initials(s){s=String(s||"?").trim();var p=s.split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase()}
function pillFor(tt){
  var m={"Sẵn sàng":"ok","Đang dùng":"ok","Đã xong":"ok","Đã đăng":"ok","Duyệt":"ok","Đã lấy":"ok",
    "Ở tủ khách":"info","Đã giao":"info","Đã xếp":"info","Chờ AI":"info","Đang giặt":"info",
    "Chờ duyệt":"warn","Chờ xác nhận":"warn","Cần AI làm lại":"warn","Sửa":"warn","Tạm dừng":"warn","Chưa đi":"warn",
    "Lỗi":"bad","Mất":"bad","Huỷ":"bad","Lệch":"bad","Hư hỏng":"bad"};
  return '<span class="pill p-'+(m[tt]||"mute")+'">'+esc(tt||"Trống")+'</span>'}
function thumb(url,name){return '<div class="thumb" aria-hidden="true">'+esc(initials(name))+(url?'<img src="'+esc(url)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</div>'}
function opts(list,sel){return list.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'}).join("")}
function dongList(){var d=rows("Dong").slice().sort(function(a,b){return N(a.ThuTu)-N(b.ThuTu)}).map(function(r){return r.TenDong}).filter(Boolean);return d.length?d:DONG_DEFAULT}
function dongInfo(name){return rows("Dong").filter(function(r){return r.TenDong===name})[0]||null}
function khachBy(ma){return rows("KhachHang").filter(function(r){return String(r.MaKH)===String(ma)})[0]||null}
function spBy(ma){return rows("SanPham").filter(function(r){return r.MaSP===ma})[0]||null}
function dkBy(ma){return rows("DangKy").filter(function(r){return r.MaDK===ma})[0]||null}

function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function recall(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

var token="",me=null;try{token=localStorage.getItem(TK)||"";me=JSON.parse(localStorage.getItem(ME)||"null")}catch(e){}
function saveAuth(t,m){token=t||"";me=m||null;try{if(token){localStorage.setItem(TK,token);localStorage.setItem(ME,JSON.stringify(me))}else{localStorage.removeItem(TK);localStorage.removeItem(ME);localStorage.removeItem("of-admin-cache")}}catch(e){}}
function api(fn,args){return new Promise(function(ok,no){
  if(!API){var x=new Error("Chưa nối máy chủ");x.code="no_api";return no(x)}
  var body=JSON.stringify(Object.assign({fn:fn,token:token},args||{})),lan=0,cho=[600,1500,3000];var done=false;
  var tm=setTimeout(function(){if(done)return;done=true;var x=new Error("Máy chủ Google phản hồi quá 45 giây.");x.code="unavailable";no(x)},45000);
  var thu=function(){fetch(API,{method:"POST",redirect:"follow",body:body}).then(function(r){return r.json()}).then(function(r){
    if(done)return;done=true;clearTimeout(tm);if(r&&r.err){var e=new Error(r.err);e.code=r.code||"error";if(e.code==="revoked"){saveAuth("",null);S.loaded=false;S.data={};render()}no(e)}else ok(r)},
    function(){if(done)return;if(lan<cho.length){setTimeout(thu,cho[lan++]);return}done=true;clearTimeout(tm);var x=new Error("Không kết nối được máy chủ.");x.code="unavailable";no(x)})};
  thu()})}
function errText(e){
  var c=e&&e.code;
  if(c==="no_api")return {t:"Chưa nối máy chủ",d:"Cần dán địa chỉ máy chủ Apps Script vào admin/config.js."};
  if(c==="forbidden")return {t:"Bạn không có quyền làm việc này",d:e.message||"Nhờ chủ tiệm cấp quyền trong tab PhanQuyen."};
  if(c==="row_moved")return {t:"Dữ liệu đã đổi",d:e.message};
  if(c==="revoked")return {t:"Phiên đăng nhập đã hết",d:"Đăng nhập lại."};
  if(c==="unavailable")return {t:"Mạng chậm hoặc máy chủ không trả lời",d:"Kiểm tra mạng rồi bấm Thử lại.",btn:true};
  return {t:"Có lỗi",d:(e&&e.message?String(e.message).slice(0,240):"Lỗi không rõ"),btn:true};
}

function parseTab(values){
  values=values||[];var h=(values[0]||[]).map(function(x){return String(x).trim()});var out=[];
  for(var i=1;i<values.length;i++){var v=values[i]||[];if(!v.some(function(c){return String(c).trim()!==""}))continue;var o={_r:i+1};h.forEach(function(k,j){if(k)o[k]=v[j]==null?"":String(v[j])});out.push(o)}
  return {head:h,rows:out}}
function applyLoad(r){Object.keys(r.tabs||{}).forEach(function(t){S.data[t]=parseTab(r.tabs[t])});if(r.me){me=r.me;saveAuth(token,me)}S.syncedAt=new Date();S.cached=false;store("of-admin-cache",{at:Date.now(),data:S.data})}
function loadAll(){
  if(!mcp){render();return Promise.resolve()}

function setCells(t,row,keyCol,keyVal,obj){return api("set",{tab:t,row:row,keyCol:keyCol,keyVal:keyVal,obj:obj})}
function appendRows(t,objs){return api("append",{tab:t,rows:objs})}
function can(sec,lv){if(!me)return false;if(me.vaiTro==="Admin")return true;var q=(me.quyen||{})[sec]||"Không";return lv==="Sửa"?q==="Sửa":q!=="Không"}
function run(label,fn,tabs){
  if(!mcp){toast("Đăng nhập để lưu");return Promise.resolve()}
  toast(label+"…",0);
  return fn().then(function(){return reloadTabs(tabs)}).then(function(){toast("Đã lưu");closeSheet()}).catch(function(e){var x=errText(e);toast(x.t+". "+x.d,6000)})}

function setSync(){
  var el=$("#sync"),b=$("#reload"),lo=$("#logout");
  b.classList.toggle("spin",S.loading);b.hidden=!mcp;lo.hidden=!mcp;
  if(!mcp){el.textContent="";return}
  if(S.loading){el.textContent="Đang tải…";return}
  if(S.syncedAt){var d=S.syncedAt;el.innerHTML=esc(me&&me.ten||"")+"<br>"+(S.cached?"Bản lưu ":"Cập nhật ")+pad(d.getHours())+":"+pad(d.getMinutes());return}
  el.textContent=me?me.ten:""}

  var up=gn.filter(function(r){var d=parseD(r.Ngay);return d&&daysBetween(t0,d)>=-7}).sort(function(a,b){return (parseD(a.Ngay)||0)-(parseD(b.Ngay)||0)});

function render(){
  var v=S.view;var m=$("#main");
  if(!mcp){m.innerHTML=vLogin();return}
  if(!can(SEC_OF_VIEW[v],"Xem")){m.innerHTML='<h1>Không có quyền</h1><p class="sub">Mục này chưa được cấp cho bạn.</p>';return}
  var html=v==="nhap"?vNhap():v==="kho"?vKho():v==="khach"?vKhach():v==="giao"?vGiao():vTong()+(S.loaded?vLaiLo():"");
  var q=$("#q");var hadFocus=q&&document.activeElement===q;var pos=hadFocus?q.selectionStart:0;
  m.innerHTML=html;
  if(hadFocus){var nq=$("#q");if(nq){nq.focus();try{nq.setSelectionRange(pos,pos)}catch(e){}}}
  document.querySelectorAll(".tabs a").forEach(function(a){if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  var cd=rows("NhapTuLink").filter(function(r){return r.TrangThai==="Chờ duyệt"}).length;var dn=$("#dotNhap");dn.hidden=!cd;dn.textContent=cd;
  var cx=rows("DangKy").filter(function(r){return r.TrangThai==="Chờ xác nhận"}).length+webMoi();var dk=$("#dotKhach");dk.hidden=!cx;dk.textContent=cx;
}

/* Chi tiết nhập */

  var imgs=[r.Anh1,r.Anh2,r.Anh3,r.Anh4].concat(String(r.AnhKhac||"").split(/\s*,\s*/)).filter(function(u){return /^https?:/.test(u||"")});
  var b='<div class="gallery">'+imgs.map(function(u,i){return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Ảnh '+(i+1)+'<img src="'+esc(u)+'" alt="" loading="lazy" onerror="this.remove()"></a>'}).join("")+'</div>';
  b+='<dl class="dl"><dt>Trạng thái</dt><dd>'+pillFor(r.TrangThai||"Chờ AI")+'</dd><dt>Tên hãng</dt><dd>'+esc(r.TenGoc||"—")+'</dd><dt>Hãng · mã</dt><dd>'+esc([r.ThuongHieu,r.MaHang].filter(Boolean).join(" · ")||"—")+'</dd><dt>Dòng · size</dt><dd>'+esc(r.Dong)+' · '+esc(r.Size)+' · '+esc(r.SoLuong||1)+' chiếc</dd><dt>Giá niêm yết</dt><dd class="num">'+(r.GiaNiemYet?money(N(r.GiaNiemYet)):"—")+'</dd><dt>Chất liệu</dt><dd>'+esc(r.ChatLieu||"—")+'</dd><dt>Link</dt><dd><a class="lk" href="'+esc(r.Link)+'" target="_blank" rel="noopener">'+esc(hostOf(r.Link))+'</a></dd>'+(r.MaSP?'<dt>Mã món</dt><dd class="mono">'+esc(r.MaSP)+'</dd>':'')+'</dl>';
  if(r.GhiChuAI)b+='<div class="note"><b>AI lưu ý:</b> '+esc(r.GhiChuAI)+'</div>';
  if(r.LoiAI)b+='<div class="note" style="background:var(--badbg)"><b>Lỗi:</b> '+esc(r.LoiAI)+'</div>';
  var draft=r.TrangThai==="Chờ duyệt"||r.TrangThai==="Cần AI làm lại";
  if(draft){
    b+='<form class="form" id="fNhap" data-ma="'+esc(ma)+'">'+fld("nTen","Tên mẫu CHÉRIE",inp("nTen",r.TenMau))+
      '<div class="two">'+fld("nLoai","Loại",sel("nLoai",LISTS.Loai,r.Loai,"Chọn"))+fld("nForm","Form",sel("nForm",LISTS.Form,r.Form,"Chọn"))+'</div>'+
      '<div class="two">'+fld("nMau","Màu",inp("nMau",r.Mau))+fld("nPC","Phong cách",sel("nPC",LISTS.PhongCach,r.PhongCach,"Chọn"))+'</div>'+
      fld("nMoNgan","Mô tả ngắn",inp("nMoNgan",r.MoTaNgan))+fld("nMoTa","Mô tả",'<textarea id="nMoTa">'+esc(r.MoTa)+'</textarea>')+
      '<div class="two">'+fld("nVon","Giá vốn",inp("nVon",N(r.GiaVon)||"","number",'inputmode="numeric"'))+fld("nGT","Giá trị bồi thường",inp("nGT",N(r.GiaTri)||"","number",'inputmode="numeric"'),"= min(vốn × 1,8; niêm yết)")+'</div>'+
      fld("nPH","Phản hồi cho AI (nếu cần làm lại)",'<textarea id="nPH" placeholder="Ví dụ: màu đúng là đen, đổi tên khác">'+esc(r.PhanHoi)+'</textarea>')+
      '<div class="btnrow"><button class="btn ok" type="button" data-act="duyet">Duyệt và đưa vào kho</button><button class="btn ghost" type="button" data-act="luuNhap">Lưu sửa</button></div>'+
      '<div class="btnrow" style="margin-top:0"><button class="btn ghost" type="button" data-act="lamLai">Gửi AI làm lại</button><button class="btn bad" type="button" data-act="bo">Bỏ món này</button></div></form>';
    if(r.Brief1)b+='<h2 style="font-size:17px">Brief chụp ảnh</h2><ol class="small" style="padding-left:18px;margin:0">'+[r.Brief1,r.Brief2,r.Brief3,r.Brief4].filter(Boolean).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol>';
  }else if(r.TrangThai==="Lỗi"||r.TrangThai==="Bỏ"){
    b+='<div class="btnrow" id="fNhap" data-ma="'+esc(ma)+'"><button class="btn" type="button" data-act="lamLaiLoi">Cho AI thử lại</button></div>';

function nhapEdits(){return {TenMau:val("nTen"),Loai:val("nLoai"),Form:val("nForm"),Mau:val("nMau"),PhongCach:val("nPC"),MoTaNgan:val("nMoNgan"),MoTa:val("nMoTa"),GiaVon:N(val("nVon"))||"",GiaTri:N(val("nGT"))||"",PhanHoi:val("nPH")}}
function curNhap(){var f=$("#fNhap");var ma=f&&f.dataset.ma;return rows("NhapTuLink").filter(function(x){return x.MaNhap===ma})[0]}
function duyet(){
  var r=curNhap();if(!r)return;var e=nhapEdits();
  if(!e.TenMau||!e.Loai){toast("Cần có tên mẫu và loại trước khi duyệt");return}
  var dup=rows("SanPham").some(function(s){return s.TenMau===e.TenMau&&s.MaNhap!==r.MaNhap});if(dup){toast("Tên mẫu đã có trong kho, đặt tên khác");return}
  var code=MA_DONG[r.Dong]||"CL";var pre="OF-"+code+"-";var mx=0;
  rows("SanPham").forEach(function(s){if(String(s.MaSP).indexOf(pre)===0){var n=parseInt(String(s.MaSP).slice(pre.length),10);if(n>mx)mx=n}});
  var stt=String(mx+1);while(stt.length<3)stt="0"+stt;var size=r.Size||"F";var n=Math.max(1,N(r.SoLuong));var ma=[];
  for(var i=0;i<n;i++)ma.push(pre+stt+"-"+size+(i?"-"+(i+1):""));
  var spRows=ma.map(function(m){return {MaSP:m,MaNhap:r.MaNhap,TenMau:e.TenMau,Dong:r.Dong,Loai:e.Loai,Size:r.Size,Mau:e.Mau,Form:e.Form,PhongCach:e.PhongCach,ThuongHieu:r.ThuongHieu,MaHang:r.MaHang,MoTaNgan:e.MoTaNgan,MoTa:e.MoTa,ChatLieu:r.ChatLieu,GiaNiemYet:N(r.GiaNiemYet)||"",GiaVon:e.GiaVon,GiaTri:e.GiaTri,SoLanMac:0,HanMac:40,TrangThai:"Sẵn sàng",AnhChinh:r.Anh1,Anh2:r.Anh2,HienTrenWeb:"Có",NgayNhap:ymd(new Date())}});
  var imgs=[r.Anh1,r.Anh2,r.Anh3,r.Anh4].concat(String(r.AnhKhac||"").split(/\s*,\s*/)).filter(function(u){return /^https?:/.test(u||"")});
  var anhRows=[];var aMx=0;rows("Anh").forEach(function(a){var k=parseInt(String(a.MaAnh).replace(/\D/g,""),10);if(k>aMx)aMx=k});
  ma.forEach(function(m){imgs.forEach(function(u,j){aMx++;var id=String(aMx);while(id.length<4)id="0"+id;anhRows.push({MaAnh:"A-"+id,MaSP:m,Loai:"Ảnh hãng",Link:u,ThuTu:j+1,GhiChu:""})})});
  run("Đang đưa "+n+" chiếc vào kho",function(){
    return setCells("NhapTuLink",r._r,"MaNhap",r.MaNhap,Object.assign({},e,{TrangThai:"Duyệt"}))
      .then(function(){return appendRows("SanPham",spRows)})
      .then(function(){return anhRows.length&&head("Anh").length?appendRows("Anh",anhRows):null})
      .then(function(){return setCells("NhapTuLink",r._r,"MaNhap",r.MaNhap,{MaSP:ma.join(" , "),TrangThai:"Đã đăng"})})},["NhapTuLink","SanPham","Anh"])}
function luuNhap(st){var r=curNhap();if(!r)return;var e=st?{TrangThai:st}:nhapEdits();if(st==="Cần AI làm lại"&&$("#nPH")){e=nhapEdits();e.TrangThai=st;if(!e.PhanHoi){toast("Ghi phản hồi để AI biết cần sửa gì");return}}
  run(st==="Bỏ"?"Đang bỏ món":"Đang lưu",function(){return setCells("NhapTuLink",r._r,"MaNhap",r.MaNhap,e)},["NhapTuLink"])}

function dkCalc(){
  var dong=val("dDong");var di=dongInfo(dong)||{};var gia=N(di.Gia);var theoDip=di.CachThue==="Theo dịp";
  var sl=Math.max(1,N(val("dThang")));var phi=theoDip?(val("dGiao")==="Văn phòng"&&val("dVung")==="Trung tâm"?0:PHI_GIAO[val("dGiao")+"|"+val("dVung")]||0):(PHI_GIAO[val("dGiao")+"|"+val("dVung")]||0);
  var coc=N(val("dCoc"));var start=parseD(val("dStart"))||today();
  var het=theoDip?addDays(start,(dong==="Travel"?5:1)*sl):addMonths(start,sl);
  return {dong:dong,gia:gia,theoDip:theoDip,sl:sl,phi:phi,coc:coc,tra:(gia+phi)*sl,het:ymd(addDays(het,theoDip?0:-1)),donVi:di.DonVi||""}}
function calcDK(){if(!$("#dSum"))return;var c=dkCalc();
  $("#dThangHint").textContent=c.theoDip?"Số lượt thuê":"Tối thiểu 3 tháng";
  $("#dSum").innerHTML='<div><span>'+esc(c.dong)+' '+esc(c.donVi)+'</span><span class="num">'+money(c.gia)+'</span></div><div><span>Phí giao '+(c.theoDip?"mỗi lượt":"mỗi tháng")+'</span><span class="num">'+money(c.phi)+'</span></div><div><span>× '+c.sl+(c.theoDip?" lượt":" tháng")+'</span><span class="num">'+money(c.tra)+'</span></div><div><span>Cọc</span><span class="num">'+money(c.coc)+'</span></div><div class="tot"><span>Khách chuyển</span><span class="num">'+money(c.tra+c.coc)+'</span></div><div class="small muted"><span>Hết hạn</span><span>'+dmy(c.het)+'</span></div>'}
function submitDK(){
  var c=dkCalc();if(!c.theoDip&&c.sl<3){toast("Gói tháng tối thiểu 3 tháng");return}

  var gn=rows("GiaoNhan");var mx=0;gn.forEach(function(g){var n=parseInt(String(g.MaChuyen).replace(/\D/g,""),10);if(n>mx)mx=n});
  var add=[];var nid=function(){mx++;var s=String(mx);while(s.length<4)s="0"+s;return "GN-"+s};
  dung.forEach(function(r){var k=khachBy(r.MaKH)||{};var di=dongInfo(r.Dong)||{};var bo=Math.max(1,Math.round((parseInt(String(di.DonVi||"").replace(/.*?(\d+)\s*bộ.*/,"$1"),10)||10)/2));
    var dc=r.GiaoTai==="Văn phòng"?(k.NoiLam||k.DiaChiGiao||""):(k.DiaChiGiao||"");
    var trips=[{Ngay:ymd(fri),Loai:"Lấy tối T6"},{Ngay:ymd(r.GiaoTai==="Nhà riêng"?sun:mon),Loai:r.GiaoTai==="Nhà riêng"?"Giao chiều CN":"Giao sáng T2"}];
    trips.forEach(function(tp){if(gn.some(function(g){return g.MaDK===r.MaDK&&g.Ngay===tp.Ngay&&g.Loai===tp.Loai}))return;

  if(!add.length){toast("Lịch tuần này đã đủ");return}
  run("Đang tạo "+add.length+" chuyến",function(){return appendRows("GiaoNhan",add)},["GiaoNhan"])}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("button,a,[data-act]");if(!el)return;var d=el.dataset;

});
